name: Roam
version: '${version}'
main: dev.roam.RoamPlugin
api-version: '1.21'
description: Random teleport with simple settings
softdepend:
  - Vault
  - PlaceholderAPI
  - WorldGuard
  - GriefPrevention
  - HuskClaims
  - HuskTowns

commands:
  roamrtp:
    description: Teleport to a random place
    usage: /<command> [world]
  roam:
    description: Same as /roamrtp, also info, reset, reload and player
    usage: /<command> [world]

permissions:
  roam.use:
    description: Use /roamrtp
    default: true
  roam.world.*:
    description: Use /roamrtp in every world, when per-world-permission is on
    default: op
  roam.bypass.cooldown:
    description: No cooldown
    default: op
  roam.bypass.delay:
    description: No delay before the teleport
    default: op
  roam.bypass.cost:
    description: The teleport is free
    default: op
  roam.admin:
    description: /roamrtp player, info, reset and reload
    default: op
  roam.group.*:
    description: Every group (the first one in config.yml wins)
    default: false
