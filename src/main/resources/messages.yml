# Messages use MiniMessage (<red>text</red>) and also old codes like &7 and &#ff8800.
# <placeholders> are filled in. Leave a message empty to turn it off.

prefix: "<#33ccff>Roam <dark_gray>» <gray>"

teleported: "Teleported to <white><x> <y> <z> <gray>in <white><world><gray>."
charged: "You paid <white><cost><gray>."
delay-start: "Teleporting in <white><seconds> seconds<gray>. Don't move!"
delay-cancelled-move: "<red>Teleport cancelled, you moved."
delay-cancelled-damage: "<red>Teleport cancelled, you took damage."
countdown: "<gray>Teleporting in <white><seconds>"
still-searching: "Finding a safe place..."
failed: "<red>No safe place was found. Try again."
cooldown: "<red>You can use /roamrtp again in <white><time><red>."
not-enough-money: "<red>You need <white><cost><red> to do that."
already-teleporting: "<red>You are already being teleported."

no-permission: "<red>You don't have permission."
no-world-permission: "<red>You can't use /roamrtp in <white><world><red>."
world-disabled: "<red>/roamrtp is turned off for <white><world><red>."
unknown-world: "<red>The world <white><world><red> doesn't exist."
players-only: "<red>Only players can do that."

reloaded: "Reloaded."
usage-player: "<red>Usage: /roamrtp player <name> [world]"
usage-reset: "<red>Usage: /roamrtp reset <name>"
player-not-found: "<red><player> is not online."
sent-player: "Teleporting <white><player><gray>."
cooldown-reset: "Reset the cooldown of <white><player><gray>."

# Shown when a player arrives. Leave both empty for no title.
title:
  title: "<gold>Teleported!"
  subtitle: "<gray><x> <y> <z>"
