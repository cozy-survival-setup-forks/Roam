# Roam - random teleport
#
# The rules are simple:
#   defaults          apply to every world
#   worlds.<name>     changes some of them for one world
#   groups.<name>     changes some of them for players with the permission roam.group.<name>
# A group wins over a world, and a world wins over the defaults. You only write what you change:
# a world that only sets radius.max keeps everything else from the defaults.
# Use /rtp info to see what the settings work out to, and to try a search.

# Set this to true to make /rtp only work as /rtp <world>. A plain /rtp then does not teleport anyone, so the
# command can be used to open a menu instead. When menu-command is set, a plain /rtp runs it as the player,
# for example "dm open rtp" for a DeluxeMenus menu whose items run /rtp world, /rtp world_nether and so on.
# Leave menu-command empty to only show the usage message.
require-world: false
menu-command: ""

# Players can use /rtp in the world they are in with just roam.use.
# When this is true, /rtp <world> also needs roam.world.<world> (or roam.world.*).
per-world-permission: false

defaults:
  shape: square            # square or circle
  radius:
    min: 100               # never closer than this to the centre
    max: 3000
  center: spawn            # spawn, player (where the player stands), or { x: 0, z: 0 }
  use-world-border: true   # never land outside the world border
  center-on-border: false  # also use the centre of the world border as the centre
  distribution: even       # even, or gaussian to make some distances more likely
  gaussian:                # only used with gaussian
    center: 0.3            # 0 = close to radius.min, 1 = close to radius.max
    shrink: 4              # bigger = points bunch up more around the centre value
  y:
    min: auto              # lowest and highest height of the spot, or auto
    max: auto
  search: auto             # auto (caves in the nether), surface, or cave
  cooldown: 60             # seconds between teleports, 0 for none
  delay: 3                 # seconds to wait before the teleport, 0 for none
  cost: 0                  # needs Vault and an economy plugin
  free-fall: 0             # teleport this many blocks above the safe block, players fall down without damage
  allowed-biomes: []       # only land in these biomes, for example [plains, forest]. Empty = any
  blocked-biomes: []       # never land in these, for example [ocean, deep_ocean, river]
  commands: []             # run as console after a teleport, with %player% %world% %x% %y% %z%
  #  - "say %player% went exploring"

# Only list the worlds that need something different.
worlds:
  world: { }
  world_nether:
    search: cave
    radius:
      min: 50
      max: 1500
  world_the_end:
    radius:
      min: 0
      max: 1000
  # spawn:
  #   redirect: world      # /rtp in the spawn world teleports to "world"
  # creative:
  #   enabled: false       # no /rtp from or to this world

# The first group the player has the permission for is used, so put the best one first.
groups:
  # vip:                   # permission: roam.group.vip
  #   cooldown: 10
  #   delay: 0
  #   radius:
  #     max: 6000

# Cooldowns are for all worlds together. Set this to true to give every world its own.
cooldown-per-world: false

# Players get hurt by nothing for this many seconds after teleporting.
invulnerable-seconds: 5

# Cancel the delay when the player moves or takes damage.
delay-cancel:
  move: true
  damage: true

# How many random spots to try before giving up.
max-attempts: 30

# Roam keeps some safe spots ready in the background, so /rtp is instant.
cache:
  enabled: true
  size: 6

# Never land inside a claim or region (WorldGuard, GriefPrevention, HuskClaims, HuskTowns).
avoid-claims: true

# The floor and the two blocks the player stands in must not be any of these.
# (Leaves are never used as a floor.)
unsafe-blocks:
  - LAVA
  - WATER
  - FIRE
  - SOUL_FIRE
  - CACTUS
  - MAGMA_BLOCK
  - CAMPFIRE
  - SOUL_CAMPFIRE
  - SWEET_BERRY_BUSH
  - POWDER_SNOW
  - COBWEB
  - WITHER_ROSE
  - POINTED_DRIPSTONE
  - CAVE_VINES
  - CAVE_VINES_PLANT
  - TRIPWIRE
  - BEDROCK

# Send new players to a random place when they first join.
first-join:
  enabled: false
  world: world

# Send players to a random place when they respawn.
on-death:
  enabled: false
  respect-bed: true        # players with a bed or respawn anchor still go there

# Sounds by name, leave empty for none.
sounds:
  countdown: block.note_block.hat
  arrive: entity.enderman.teleport
