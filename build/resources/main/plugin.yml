name: Roam
version: '1.0.1'
main: dev.roam.RoamPlugin
api-version: '1.21'
description: Random teleport with simple settings
softdepend:
  - Vault
  - PlaceholderAPI
  - WorldGuard
  - GriefPrevention
  - HuskClaims
  - HuskTowns

commands:
  rtp:
    description: Teleport to a random place
    aliases: [wild, randomtp]
    usage: /<command> [world]

permissions:
  roam.use:
    description: Use /rtp
    default: true
  roam.world.*:
    description: Use /rtp in every world, when per-world-permission is on
    default: op
  roam.bypass.cooldown:
    description: No cooldown
    default: op
  roam.bypass.delay:
    description: No delay before the teleport
    default: op
  roam.bypass.cost:
    description: The teleport is free
    default: op
  roam.admin:
    description: /rtp player, info, reset and reload
    default: op
  roam.group.*:
    description: Every group (the first one in config.yml wins)
    default: false
